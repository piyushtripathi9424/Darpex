services:
  - type: web
    name: darpex-backend
    env: node
    rootDir: .
    buildCommand: npm install && npm run build && cd backend && npm install
    startCommand: cd backend && npm run start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
